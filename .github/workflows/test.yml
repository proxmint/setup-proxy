name: test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - id: proxy
        uses: ./
        with:
          country: us
      - name: Request through the proxy
        shell: bash # pipefail, so a failed curl fails the step instead of jq's exit 0 passing it
        run: curl -fsS --max-time 30 --retry 2 --retry-all-errors https://ipinfo.io/json | jq '{country, org}'
        env:
          HTTPS_PROXY: ${{ steps.proxy.outputs.url }}
